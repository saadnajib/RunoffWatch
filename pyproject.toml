[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runoffwatch"
version = "0.2.0"
description = "Machine learning on PRZM simulations: when does rain wash pesticide off the soil?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "py7zr>=0.20",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45"]
dev = ["pytest>=8"]

[project.scripts]
runoffwatch = "runoffwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["runoffwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
