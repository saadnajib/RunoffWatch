[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runoffwatch"
version = "0.3.0"
description = "Machine-learning surrogate of the PRZM pesticide runoff model, with a spray-day advisor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "py7zr>=0.20",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[project.scripts]
runoffwatch = "runoffwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["runoffwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
